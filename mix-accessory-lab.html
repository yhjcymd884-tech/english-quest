<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>包包與飾品融合測試</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f9f3f4;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.lab{position:relative;width:min(100vw,941px);height:100dvh;margin:auto;overflow:hidden;background:#f7ecee}.stage{position:absolute;inset:0}.stage img{width:100%;height:100%;object-fit:fill;display:block}.note{position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:10px 17px;border-radius:999px;background:rgba(255,250,245,.88);color:#5d5260;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 4px 18px rgba(80,50,60,.08)}.controls{position:absolute;z-index:3;left:3%;right:3%;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-radius:24px;background:rgba(255,251,249,.94);box-shadow:0 8px 30px rgba(65,40,50,.18)}button{min-height:58px;border:2px solid #eadde1;border-radius:18px;background:#fff;color:#5e5360;font-size:18px;font-weight:800;touch-action:manipulation}button.on{border-color:#ef5d9f;background:#ef5d9f;color:white}@media(min-width:700px){.note{font-size:18px}.controls{left:12%;right:12%}}
</style>
</head>
<body>
<main class="lab">
  <div class="stage"><img class="preview" src="assets/mix-lab/top-cream-bottom-pink-shoes-loafers-fused-preview-v1.webp" alt="女孩包包與飾品換裝預覽"></div>
  <div class="note">包包與飾品完整融合測試</div>
  <nav class="controls" aria-label="包包與飾品選擇">
    <button type="button" data-part="bag" aria-pressed="false">白色手提包</button>
    <button type="button" data-part="accessory" aria-pressed="false">珍珠項鍊</button>
  </nav>
</main>
<script>
const preview=document.querySelector('.preview');
const state={bag:false,accessory:false};
const scenes={
  '00':'assets/mix-lab/top-cream-bottom-pink-shoes-loafers-fused-preview-v1.webp',
  '10':'assets/mix-lab/full-outfit-bag-tote-fused-v1.webp',
  '01':'assets/mix-lab/full-outfit-pearl-necklace-fused-v1.webp',
  '11':'assets/mix-lab/full-outfit-bag-tote-pearl-necklace-fused-v1.webp'
};
function render(){
  const key=Number(state.bag)+''+Number(state.accessory);
  preview.src=scenes[key];
  document.querySelectorAll('[data-part]').forEach(button=>{
    const active=state[button.dataset.part];
    button.classList.toggle('on',active);
    button.setAttribute('aria-pressed',String(active));
  });
}
document.querySelectorAll('[data-part]').forEach(button=>button.addEventListener('click',()=>{
  state[button.dataset.part]=!state[button.dataset.part];
  render();
}));
</script>
</body>
</html>
