 const q=v81Exam.qs[v81Exam.i],correct=q.a||q.answer,ok=ans===correct;
 document.querySelectorAll('[data-v81ans]').forEach(b=>{b.disabled=true;if(b.dataset.v81ans===correct)b.classList.add('good');else if(b.dataset.v81ans===ans)b.classList.add('bad')});
 if(ok){v81Exam.score++;S.coins+=8;addXP(5);save();renderRPGStats()}else{S.wrongWords[correct]=(S.wrongWords[correct]||0)+1;v87AddWrong(v81Exam.type==='vocab'?'vocab':'grammar',q.q,correct,q.opts||[],q.source||'大會考')}
 const card=document.querySelector('.v81ExamCard');if(card){const d=document.createElement('div');d.className='v82Feedback '+(ok?'good':'bad');d.textContent=ok?'答對了 ✓  +8 金幣 +5 EXP':'答錯了，正確答案：'+correct;card.appendChild(d)}

}

<script id="v83-auto-next">
(function(){
 const AUTO_DELAY=850;

 function visible(el){return !!(el && el.offsetParent!==null)}
 function autoAdvanceQuiz(){
   setTimeout(()=>{
     const candidates=[
       document.querySelector('[data-next]'),
       document.querySelector('#nextBtn'),
       ...document.querySelectorAll('button')
     ].filter(Boolean);
     const btn=candidates.find(b=>visible(b)&&/下一題|下一關|繼續/.test(b.textContent||''));
     if(btn){btn.click();return}
     if(typeof nextQ==='function'){nextQ();return}
     if(typeof nextQuestion==='function'){nextQuestion();return}
   },AUTO_DELAY);
 }
 function autoAdvanceBattle(){
   setTimeout(()=>{
     if(typeof battle==='undefined'||!battle)return;
     // Defeated monsters still use the existing reward/next-monster flow.
     const buttons=[...document.querySelectorAll('#gamebox button')];
     const next=buttons.find(b=>visible(b)&&/下一題|繼續挑戰|下一隻|繼續戰鬥/.test(b.textContent||''));
     if(next){next.click();return}
     // If the same monster is alive, existing renderBattle() produces the next question.
     if(typeof renderBattle==='function' && battle && battle.hp>0 && !battle.locked)renderBattle();
   },AUTO_DELAY);
 }

 // Observe answer-result UI instead of rewriting scoring logic.
 const obs=new MutationObserver(muts=>{
   const box=document.getElementById('gamebox');
   if(!box)return;
   const text=box.textContent||'';
   if(/答對了|答錯了|正確答案/.test(text)){
     if(box.querySelector('.battleArena,.battleStage')) autoAdvanceBattle();
     else if(box.querySelector('.quiz,.quizCard,[data-quiz],.questionCard') || /第\s*\d+\s*題/.test(text)) autoAdvanceQuiz();
   }
 });
 window.addEventListener('load',()=>{
   const box=document.getElementById('gamebox');
   if(box)obs.observe(box,{childList:true,subtree:true,characterData:true});
 });

 // Existing battle answer function is called by data-battleans buttons.
 document.addEventListener('click',e=>{
   if(e.target.closest('[data-battleans]')) autoAdvanceBattle();
   if(e.target.closest('[data-answer],[data-ans]')) autoAdvanceQuiz();
 });
})();
</script>

<script id="v103-wardrobe-categories-script">
(()=>{
 const categories={
  daily:{label:'日常',items:[['daily-pink','粉色格紋','assets/wardrobe-daily-pink-v107.jpeg?v=20260918-1','assets/wardrobe-thumbs/daily-pink.webp?v=20260918-2'],['daily-latte','奶茶套裝','assets/wardrobe-daily-latte-v107.jpeg?v=20260918-1','assets/wardrobe-thumbs/daily-latte.webp?v=20260918-2'],['daily-blue','藍色洋裝','assets/wardrobe-daily-blue-v107.jpeg?v=20260918-1','assets/wardrobe-thumbs/daily-blue.webp?v=20260918-2'],['daily-black','黑色洋裝','assets/wardrobe-daily-black-v107.jpeg?v=20260918-1','assets/wardrobe-thumbs/daily-black.webp?v=20260918-2']]},
  campus:{label:'校園',items:[['campus-sailor','水手制服','assets/wardrobe-campus-sailor-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/campus-sailor.webp?v=20260918-2'],['campus-cardigan','針織制服','assets/wardrobe-campus-cardigan-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/campus-cardigan.webp?v=20260918-2'],['campus-blazer','西裝制服','assets/wardrobe-campus-blazer-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/campus-blazer.webp?v=20260918-2'],['campus-sport','運動校服','assets/wardrobe-campus-sport-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/campus-sport.webp?v=20260918-2']]},
  sweet:{label:'甜美',items:[['sweet-strawberry','草莓甜心','assets/wardrobe-sweet-strawberry-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/sweet-strawberry.webp?v=20260918-2'],['sweet-lavender','薰衣草夢','assets/wardrobe-sweet-lavender-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/sweet-lavender.webp?v=20260918-2'],['sweet-cream','奶油玫瑰','assets/wardrobe-sweet-cream-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/sweet-cream.webp?v=20260918-2'],['sweet-rose','玫瑰茶會','assets/wardrobe-sweet-rose-v104.jpeg?v=20260917-2','assets/wardrobe-thumbs/sweet-rose.webp?v=20260918-2']]},
  casual:{label:'休閒',items:[['casual-hoodie','粉色帽T','assets/wardrobe-casual-hoodie-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/casual-hoodie.webp?v=20260918-2'],['casual-knit','針織長裙','assets/wardrobe-casual-knit-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/casual-knit.webp?v=20260918-2'],['casual-overalls','牛仔吊帶','assets/wardrobe-casual-overalls-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/casual-overalls.webp?v=20260918-2'],['casual-cafe','森系洋裝','assets/wardrobe-casual-cafe-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/casual-cafe.webp?v=20260918-2']]},
  special:{label:'特殊',items:[['special-kimono','櫻花和服','assets/wardrobe-special-kimono-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/special-kimono.webp?v=20260918-2'],['special-princess','冰藍公主','assets/wardrobe-special-princess-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/special-princess.webp?v=20260918-2'],['special-witch','星月魔女','assets/wardrobe-special-witch-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/special-witch.webp?v=20260918-2'],['special-holiday','冬日節慶','assets/wardrobe-special-holiday-v108.jpeg?v=20260918-1','assets/wardrobe-thumbs/special-holiday.webp?v=20260918-2']]}
 };
 let category='daily',outfit='daily-latte';
 try{category=localStorage.getItem('englishQuestWardrobeCategory')||category;outfit=localStorage.getItem('englishQuestWardrobeV103')||outfit}catch{}
 const findItem=id=>Object.values(categories).flatMap(c=>c.items).find(i=>i[0]===id);
 const needsChrome=()=>false;
 const chrome='<div class="v105WardrobeChrome" aria-label="衣櫥換裝操作"><div class="v105ChromeSprite title" aria-hidden="true"></div><div class="v105ChromeSprite back" aria-hidden="true"></div><div class="v105ChromeSprite save" aria-hidden="true"></div><div class="v105ChromeSprite side" aria-hidden="true"></div><div class="v105ChromeSprite quote" aria-hidden="true"></div><button class="v105ChromeBack" data-v105-back aria-label="返回首頁">‹</button><button class="v105ChromeSave" data-v105-save aria-label="儲存穿搭">儲存</button></div>';
 const setPortrait=item=>{const portrait=document.querySelector('#wardrobe .v103Portrait'),image=portrait&&portrait.querySelector('img');if(!portrait||!image||!item)return;image.src=item[2];portrait.classList.toggle('v105NeedsChrome',needsChrome(item[0]))};
 const save=()=>{try{localStorage.setItem('englishQuestWardrobeCategory',category);localStorage.setItem('englishQuestWardrobeV103',outfit)}catch{}};
 const renderOptions=()=>{
  const box=document.querySelector('#wardrobe .v103OutfitGrid');if(!box)return;
  box.innerHTML=categories[category].items.map(i=>'<button data-v103-outfit="'+i[0]+'" class="'+(i[0]===outfit?'on':'')+'" aria-label="換上'+i[1]+'"><img src="'+i[3]+'" alt="'+i[1]+'完整服裝縮圖"><span>'+i[1]+'</span></button>').join('');
  document.querySelectorAll('[data-v103-category]').forEach(b=>b.classList.toggle('on',b.dataset.v103Category===category));
 };
 const showWardrobe=()=>{
  const sec=document.getElementById('wardrobe');if(!sec)return;
  if(!categories[category])category='daily';
  let current=findItem(outfit);if(!current){current=categories[category].items[0];outfit=current[0]}
  sec.innerHTML='<div class="v103Wardrobe"><div class="v103Portrait '+(needsChrome(current[0])?'v105NeedsChrome':'')+'"><img src="'+current[2]+'" alt="衣櫥換裝畫面">'+chrome+'</div><div class="v103CategoryTabs">'+Object.entries(categories).map(([k,c])=>'<button data-v103-category="'+k+'">'+c.label+'</button>').join('')+'</div><div class="v103OutfitGrid"></div></div>';
  renderOptions();
 };
 renderWard=showWardrobe;
 document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-v103-category]');
  if(tab){category=tab.dataset.v103Category;outfit=categories[category].items[0][0];save();const item=findItem(outfit);setPortrait(item);renderOptions();return}
  const btn=e.target.closest('[data-v103-outfit]');
  if(!btn)return;
  outfit=btn.dataset.v103Outfit;const item=findItem(outfit);if(!item)return;save();setPortrait(item);renderOptions();
 });
 document.addEventListener('click',e=>{if(e.target.closest('[data-v105-back]')){go('home');return}if(!e.target.closest('[data-v105-save]'))return;save();const old=document.querySelector('.v105Toast');if(old)old.remove();const toast=document.createElement('div');toast.className='v105Toast';toast.textContent='穿搭已儲存';document.body.appendChild(toast);setTimeout(()=>toast.remove(),1400)});
})();
</script>
