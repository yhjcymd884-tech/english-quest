function showCustom(id){all('.page').forEach(p=>p.classList.remove('on'));hideCustom();const s=$(id);if(s)s.hidden=false;noScroll(true);window.scrollTo(0,0)}
function openBattle(){showCustom('#battle119');newEnemy();setTimeout(()=>$('#q119Answer')?.focus(),50)}
function startVocab(type){if(type==='words'){showCustom('#vocabExam119');return}const mapping={verb:1,noun:0,opposite:0,irregular:2};if(typeof startQuiz==='function'){hideCustom();noScroll(false);startQuiz(mapping[type]??0)}}
function init(){buildHome();buildMap();buildGrammar();buildVocab();buildExam();buildBattle();if(typeof window.go==='function'){const legacyGo=window.go;window.go=function(id){hideCustom();noScroll(id==='home'||id==='map');return legacyGo(id)}}if($('#home')?.classList.contains('on'))noScroll(true);
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const q=b.dataset.q119;if(q){e.preventDefault();e.stopImmediatePropagation();if(['home','map','wardrobe','pet','games'].includes(q))openPage(q);else if(q==='grammar')showCustom('#grammarForest119');else if(q==='vocab')showCustom('#vocabTown119');else if(q==='battle')openBattle();else if(q==='locked')alert('完成前一區的挑戰後就能解鎖 ♡');return}
 if(b.dataset.q119Topic!==undefined){e.preventDefault();e.stopImmediatePropagation();hideCustom();noScroll(false);if(typeof startQuiz==='function')startQuiz(+b.dataset.q119Topic);return}
 if(b.dataset.q119Vocab){e.preventDefault();e.stopImmediatePropagation();startVocab(b.dataset.q119Vocab);return}
 if(b.dataset.q119ExamTopic!==undefined){const k=b.dataset.q119ExamTopic;b.classList.toggle('selected');b.classList.contains('selected')?examTopics.add(k):examTopics.delete(k);return}
 if(b.dataset.q119Count){examCount=+b.dataset.q119Count;all('[data-q119-count]').forEach(x=>x.classList.toggle('selected',x===b));return}
 if(b.hasAttribute('data-q119-exam-start')){hideCustom();noScroll(false);if(typeof v81Menu==='function'&&typeof v81StartVocab==='function'){v81Menu('vocab');v82ExamCount=examCount;const verbOnly=examTopics.size===1&&examTopics.has('1');document.querySelectorAll('input[name="v81"]').forEach(x=>x.checked=verbOnly?x.value==='verbs':x.value==='thousand');v81StartVocab()}else if(typeof game==='function')game('spell');return}
 if(b.id==='q119Attack'){attack();return}if(b.id==='q119Speak'&&fight){speechSynthesis.speak(new SpeechSynthesisUtterance(fight.q[1]));return}if(b.id==='q119Hint'&&fight){if(typeof S!=='undefined'&&(S.coins||0)>=10){S.coins-=10;if(typeof save==='function')save();$('#q119Answer').value=fight.q[1].slice(0,Math.ceil(fight.q[1].length/2));$('#q119Msg').textContent='已顯示一半提示'}else $('#q119Msg').textContent='金幣不足';return}
 const battleEntry=b.matches('[data-game="battle"],[data-v80-action="battle"]');if(battleEntry){e.preventDefault();e.stopImmediatePropagation();openBattle()}
 },true);
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='q119Answer')attack()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
</body></html>
