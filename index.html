<script id="v103-wardrobe-categories-script">
(()=>{
 const categories={
  daily:{label:'日常',items:[['daily-pink','粉色格紋','assets/wardrobe-v102-pink.jpeg?v=20260917-2'],['daily-latte','奶茶套裝','assets/wardrobe-v101.jpeg?v=20260917-3'],['daily-blue','藍色洋裝','assets/wardrobe-v102-blue.jpeg?v=20260917-2'],['daily-black','黑色洋裝','assets/wardrobe-v102-black.jpeg?v=20260917-2']]},
  campus:{label:'校園',items:[['campus-sailor','水手制服','assets/wardrobe-campus-sailor-v104.jpeg?v=20260917-2'],['campus-cardigan','針織制服','assets/wardrobe-campus-cardigan-v104.jpeg?v=20260917-2'],['campus-blazer','西裝制服','assets/wardrobe-campus-blazer-v104.jpeg?v=20260917-2'],['campus-sport','運動校服','assets/wardrobe-campus-sport-v104.jpeg?v=20260917-2']]},
  sweet:{label:'甜美',items:[['sweet-strawberry','草莓甜心','assets/wardrobe-sweet-strawberry-v104.jpeg?v=20260917-2'],['sweet-lavender','薰衣草夢','assets/wardrobe-sweet-lavender-v104.jpeg?v=20260917-2'],['sweet-cream','奶油玫瑰','assets/wardrobe-sweet-cream-v104.jpeg?v=20260917-2'],['sweet-rose','玫瑰茶會','assets/wardrobe-sweet-rose-v104.jpeg?v=20260917-2']]},
  casual:{label:'休閒',items:[['casual-hoodie','粉色帽T','assets/wardrobe-casual-hoodie-v104.jpeg?v=20260917-2'],['casual-knit','針織長裙','assets/wardrobe-casual-knit-v104.jpeg?v=20260917-2'],['casual-overalls','牛仔吊帶','assets/wardrobe-casual-overalls-v104.jpeg?v=20260917-2'],['casual-cafe','森系洋裝','assets/wardrobe-casual-cafe-v104.jpeg?v=20260917-2']]},
  special:{label:'特殊',items:[['special-kimono','櫻花和服','assets/wardrobe-special-kimono-v104.jpeg?v=20260917-2'],['special-princess','冰藍公主','assets/wardrobe-special-princess-v104.jpeg?v=20260917-2'],['special-witch','星月魔女','assets/wardrobe-special-witch-v104.jpeg?v=20260917-2'],['special-holiday','冬日節慶','assets/wardrobe-special-holiday-v104.jpeg?v=20260917-2']]}
 };
 let category='daily',outfit='daily-latte';
 try{category=localStorage.getItem('englishQuestWardrobeCategory')||category;outfit=localStorage.getItem('englishQuestWardrobeV103')||outfit}catch{}
 const findItem=id=>Object.values(categories).flatMap(c=>c.items).find(i=>i[0]===id);
 const save=()=>{try{localStorage.setItem('englishQuestWardrobeCategory',category);localStorage.setItem('englishQuestWardrobeV103',outfit)}catch{}};
 const renderOptions=()=>{
  const box=document.querySelector('#wardrobe .v103OutfitGrid');if(!box)return;
  box.innerHTML=categories[category].items.map(i=>'<button data-v103-outfit="'+i[0]+'" class="'+(i[0]===outfit?'on':'')+'" aria-label="換上'+i[1]+'"><img src="'+i[2]+'" alt=""><span>'+i[1]+'</span></button>').join('');
  document.querySelectorAll('[data-v103-category]').forEach(b=>b.classList.toggle('on',b.dataset.v103Category===category));
 };
 const showWardrobe=()=>{
  const sec=document.getElementById('wardrobe');if(!sec)return;
  if(!categories[category])category='daily';
  let current=findItem(outfit);if(!current){current=categories[category].items[0];outfit=current[0]}
  sec.innerHTML='<div class="v103Wardrobe"><div class="v103Portrait"><img src="'+current[2]+'" alt="衣櫥換裝畫面"></div><div class="v103CategoryTabs">'+Object.entries(categories).map(([k,c])=>'<button data-v103-category="'+k+'">'+c.label+'</button>').join('')+'</div><div class="v103OutfitGrid"></div></div>';
  renderOptions();
 };
 renderWard=showWardrobe;
 document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-v103-category]');
  if(tab){category=tab.dataset.v103Category;outfit=categories[category].items[0][0];save();const item=findItem(outfit);document.querySelector('#wardrobe .v103Portrait img').src=item[2];renderOptions();return}
  const btn=e.target.closest('[data-v103-outfit]');
  if(!btn)return;
  outfit=btn.dataset.v103Outfit;const item=findItem(outfit);if(!item)return;save();document.querySelector('#wardrobe .v103Portrait img').src=item[2];renderOptions();
 });
})();
</script>
