<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quest 混搭測試</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6f8;color:#594b67;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.lab{max-width:480px;margin:auto;min-height:100vh;background:#fff}.stage{position:relative;width:100%;aspect-ratio:1080/1919;overflow:hidden}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.base{z-index:1}.top{z-index:2}.bottom{z-index:3}.shoes{z-index:4}.controls{position:fixed;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);width:min(450px,94%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fffdf6e8;border:1px solid #efdce4;border-radius:22px;backdrop-filter:blur(10px);box-shadow:0 8px 25px #8e6e7a33}.controls button{border:1px solid #ead9df;border-radius:15px;padding:11px 5px;background:#fff;color:#5e5268;font-weight:800}.controls button.on{background:#f06aa1;color:#fff;border-color:#f06aa1}.note{position:fixed;z-index:9;top:10px;left:50%;transform:translateX(-50%);background:#fffdf0dd;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;white-space:nowrap}
</style>
</head>
<body><main class="lab"><div class="note">獨立混搭測試，不影響正式衣櫃</div><div class="stage"><img class="base" src="assets/wardrobe-fitted/top-cream-scene-v1.webp" alt="女孩穿著奶油針織上衣"><img class="bottom" src="assets/mix-lab/bottom-pink-v1.png" alt="粉格短裙"><img class="shoes" src="assets/mix-lab/shoes-loafers-v2.png" alt="棕色樂福鞋"></div><nav class="controls"><button class="on" data-layer="top">上衣</button><button class="on" data-layer="bottom">下身</button><button class="on" data-layer="shoes">鞋子</button></nav></main><script>const base=document.querySelector('.base');document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');const on=b.classList.contains('on');if(b.dataset.layer==='top'){base.src=on?'assets/wardrobe-fitted/top-cream-scene-v1.webp':'assets/wardrobe-base-clean-v120.webp';return}document.querySelector('.'+b.dataset.layer).hidden=!on})</script></body></html>
