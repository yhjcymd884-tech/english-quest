<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quest 混搭測試</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6f8;color:#594b67;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.lab{max-width:480px;margin:auto;min-height:100vh;background:#fff}.stage{position:relative;width:100%;aspect-ratio:1080/1919;overflow:hidden}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.base{z-index:1}.top{z-index:2}.bottom{z-index:3}.foreground{z-index:4}.shoes{z-index:5}.controls{position:fixed;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);width:min(450px,94%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#fffdf6e8;border:1px solid #efdce4;border-radius:22px;backdrop-filter:blur(10px);box-shadow:0 8px 25px #8e6e7a33}.controls button{border:1px solid #ead9df;border-radius:15px;padding:11px 5px;background:#fff;color:#5e5268;font-weight:800}.controls button.on{background:#f06aa1;color:#fff;border-color:#f06aa1}.note{position:fixed;z-index:9;top:10px;left:50%;transform:translateX(-50%);background:#fffdf0dd;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:800;white-space:nowrap}
</style>
</head>
<body><main class="lab"><div class="note">完整融合換裝測試，不影響正式衣櫃</div><div class="stage"><img class="base" src="assets/mix-lab/top-cream-bottom-pink-shoes-loafers-fused-preview-v1.webp" alt="女孩換裝預覽"></div><nav class="controls"><button class="on" data-part="top">上衣</button><button class="on" data-part="bottom">下身</button><button class="on" data-part="shoes">鞋子</button></nav></main><script>const preview=document.querySelector('.base');const state={top:true,bottom:true,shoes:true};const scenes={'000':'assets/wardrobe-base-clean-v120.webp','100':'assets/wardrobe-fitted/top-cream-scene-v1.webp','010':'assets/wardrobe-fitted/bottom-pinkSkirt-scene-v1.webp','001':'assets/wardrobe-shoe-scenes/shoes-loafers-fitted-v2.webp','110':'assets/mix-lab/top-cream-bottom-pink-fused-preview-v2.webp','101':'assets/mix-lab/top-cream-shoes-loafers-fused-v1.webp','011':'assets/mix-lab/bottom-pink-shoes-loafers-fused-v1.webp','111':'assets/mix-lab/top-cream-bottom-pink-shoes-loafers-fused-preview-v1.webp'};function render(){const key=Number(state.top)+''+Number(state.bottom)+''+Number(state.shoes);preview.src=scenes[key];document.querySelectorAll('[data-part]').forEach(button=>button.classList.toggle('on',state[button.dataset.part]))}document.querySelectorAll('[data-part]').forEach(button=>button.addEventListener('click',()=>{state[button.dataset.part]=!state[button.dataset.part];render()}));</script></body></html>
