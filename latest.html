<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Quest 最新版</title>
<style>html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#fff6f8;color:#a84d73;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.loading{text-align:center;font-weight:800}.dot{font-size:28px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.35}}</style>
</head>
<body><div class="loading"><div class="dot">♡</div>正在開啟完整新衣櫃…</div>
<script>
fetch('https://raw.githubusercontent.com/yhjcymd884-tech/english-quest/afe01e535a4214f6231925561e71238fc9cfd9ee/index.html',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('load');return r.text()})
 .then(html=>{
   html=html.replace('<head>','<head><base href="https://yhjcymd884-tech.github.io/english-quest/">');
   html=html.replace(/assets\/wardrobe-v110\.css\?v=[^"]+/,'assets/wardrobe-v110.css?v=creambottoms-v1');
   html=html.replace(/assets\/wardrobe-v110\.js\?v=[^"]+/,'assets/wardrobe-v110.js?v=creambottoms-v1');
   document.open();document.write(html);document.close();
 })
 .catch(()=>{document.body.innerHTML='<div class="loading">載入失敗，請按右下角重新整理一次</div>'});
</script>
</body>
</html>
