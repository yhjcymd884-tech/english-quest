<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>完整融合衣櫃候選版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f9f0f3;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{position:relative;width:min(100vw,760px);height:100dvh;margin:auto;overflow:hidden;background:#f8edf1}.scene{position:absolute;inset:0 0 178px}.scene img{width:100%;height:100%;object-fit:contain;display:block;background:#f9f2f2}.topbar{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.title,.saved{padding:9px 14px;border-radius:999px;background:rgba(255,250,247,.9);box-shadow:0 4px 18px rgba(80,45,60,.12);color:#5c4f5d;font-size:14px;font-weight:800}.saved{opacity:0;transition:.2s}.saved.show{opacity:1}.picker{position:absolute;z-index:4;left:0;right:0;bottom:0;height:178px;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(255,250,249,.97);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(80,45,60,.14)}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}.tabs button,.save{border:1px solid #eadde1;border-radius:13px;background:#fff;color:#5c5260;font-weight:800;min-height:38px;font-size:14px;touch-action:manipulation}.tabs button.on{background:#ee629f;border-color:#ee629f;color:white}.row{display:grid;grid-template-columns:repeat(4,1fr) 62px;gap:7px;height:105px}.card{position:relative;overflow:hidden;border:2px solid #eadde1;border-radius:14px;background:#fff;padding:0;color:#5c5260;touch-action:manipulation}.card.on{border-color:#ee5799;box-shadow:0 0 0 2px rgba(238,87,153,.18)}.card img{width:100%;height:72px;object-fit:contain;display:block}.card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 3px;font-size:11px;font-weight:800}.card.on:after{content:'✓';position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#ee5799;color:white;font-weight:900}.save{height:100%;background:#ee5799;color:white;border-color:#ee5799;font-size:15px}@media(min-width:700px){.scene{inset:0 0 210px}.picker{height:210px;padding:14px 18px}.row{height:125px;gap:10px}.card img{height:89px}.card span{font-size:13px}.tabs button{font-size:16px}}
</style>
</head>
<body>
<main class="app">
  <div class="scene"><img id="preview" alt="完整融合穿搭預覽"></div>
  <div class="topbar"><div class="title">完整融合衣櫃候選版</div><div class="saved" id="saved">已儲存</div></div>
  <section class="picker" aria-label="完整穿搭選擇">
    <nav class="tabs" id="tabs"></nav>
    <div class="row" id="outfits"></div>
  </section>
</main>
<script>
const groups={
 daily:{label:'日常',items:[['daily-pink','粉色格紋','assets/wardrobe-daily-pink-v107.jpeg','assets/wardrobe-thumbs/daily-pink.webp'],['daily-latte','奶茶套裝','assets/wardrobe-daily-latte-v107.jpeg','assets/wardrobe-thumbs/daily-latte.webp'],['daily-blue','藍色洋裝','assets/wardrobe-daily-blue-v107.jpeg','assets/wardrobe-thumbs/daily-blue.webp'],['daily-black','黑色洋裝','assets/wardrobe-daily-black-v107.jpeg','assets/wardrobe-thumbs/daily-black.webp']]},
 campus:{label:'校園',items:[['campus-sailor','水手制服','assets/wardrobe-campus-sailor-v104.jpeg','assets/wardrobe-thumbs/campus-sailor.webp'],['campus-cardigan','針織制服','assets/wardrobe-campus-cardigan-v104.jpeg','assets/wardrobe-thumbs/campus-cardigan.webp'],['campus-blazer','西裝制服','assets/wardrobe-campus-blazer-v104.jpeg','assets/wardrobe-thumbs/campus-blazer.webp'],['campus-sport','運動校服','assets/wardrobe-campus-sport-v104.jpeg','assets/wardrobe-thumbs/campus-sport.webp']]},
 sweet:{label:'甜美',items:[['sweet-strawberry','草莓甜心','assets/wardrobe-sweet-strawberry-v104.jpeg','assets/wardrobe-thumbs/sweet-strawberry.webp'],['sweet-lavender','薰衣草夢','assets/wardrobe-sweet-lavender-v104.jpeg','assets/wardrobe-thumbs/sweet-lavender.webp'],['sweet-cream','奶油玫瑰','assets/wardrobe-sweet-cream-v104.jpeg','assets/wardrobe-thumbs/sweet-cream.webp'],['sweet-rose','玫瑰茶會','assets/wardrobe-sweet-rose-v104.jpeg','assets/wardrobe-thumbs/sweet-rose.webp']]},
 casual:{label:'休閒',items:[['casual-hoodie','粉色帽T','assets/wardrobe-casual-hoodie-v108.jpeg','assets/wardrobe-thumbs/casual-hoodie.webp'],['casual-knit','針織長裙','assets/wardrobe-casual-knit-v108.jpeg','assets/wardrobe-thumbs/casual-knit.webp'],['casual-overalls','牛仔吊帶','assets/wardrobe-casual-overalls-v108.jpeg','assets/wardrobe-thumbs/casual-overalls.webp'],['casual-cafe','森系洋裝','assets/wardrobe-casual-cafe-v108.jpeg','assets/wardrobe-thumbs/casual-cafe.webp']]},
 special:{label:'特殊',items:[['special-kimono','櫻花和服','assets/wardrobe-special-kimono-v108.jpeg','assets/wardrobe-thumbs/special-kimono.webp'],['special-princess','冰藍公主','assets/wardrobe-special-princess-v108.jpeg','assets/wardrobe-thumbs/special-princess.webp'],['special-witch','星月魔女','assets/wardrobe-special-witch-v108.jpeg','assets/wardrobe-thumbs/special-witch.webp'],['special-holiday','冬日節慶','assets/wardrobe-special-holiday-v108.jpeg','assets/wardrobe-thumbs/special-holiday.webp']]}
};
const preview=document.querySelector('#preview'),tabs=document.querySelector('#tabs'),outfits=document.querySelector('#outfits'),saved=document.querySelector('#saved');
let group='daily',selected=localStorage.getItem('eq-fused-outfit')||'daily-pink';
function find(id){for(const data of Object.values(groups)){const item=data.items.find(x=>x[0]===id);if(item)return item}return groups.daily.items[0]}
function render(){
 tabs.innerHTML=Object.entries(groups).map(([id,data])=>`<button type="button" data-group="${id}" class="${id===group?'on':''}">${data.label}</button>`).join('');
 outfits.innerHTML=groups[group].items.map(item=>`<button type="button" class="card ${item[0]===selected?'on':''}" data-outfit="${item[0]}"><img src="${item[3]}" alt=""><span>${item[1]}</span></button>`).join('')+'<button type="button" class="save" id="save">儲存</button>';
 preview.src=find(selected)[2];
 tabs.querySelectorAll('[data-group]').forEach(button=>button.onclick=()=>{group=button.dataset.group;render()});
 outfits.querySelectorAll('[data-outfit]').forEach(button=>button.onclick=()=>{selected=button.dataset.outfit;preview.src=find(selected)[2];render()});
 document.querySelector('#save').onclick=()=>{localStorage.setItem('eq-fused-outfit',selected);saved.classList.add('show');setTimeout(()=>saved.classList.remove('show'),1200)};
}
render();
</script>
</body>
</html>
